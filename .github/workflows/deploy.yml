name: Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
        - testnet
        - mainnet
      network:
        description: 'Network to deploy to'
        required: true
        default: 'sepolia'
        type: choice
        options:
        - sepolia
        - arbitrum-sepolia
        - optimism-sepolia
        - ethereum
        - arbitrum
        - optimism

jobs:
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testnet'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: |
        pnpm install
        forge install --no-commit
        
    - name: Build contracts
      run: forge build --via-ir
      
    - name: Run tests
      run: forge test --via-ir
      
    - name: Deploy to ${{ github.event.inputs.network }}
      run: |
        if [ "${{ github.event.inputs.network }}" = "sepolia" ]; then
          forge script script/DeployEnhanced.s.sol \
            --rpc-url ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --via-ir
        elif [ "${{ github.event.inputs.network }}" = "arbitrum-sepolia" ]; then
          forge script script/DeployEnhanced.s.sol \
            --rpc-url ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --via-ir
        elif [ "${{ github.event.inputs.network }}" = "optimism-sepolia" ]; then
          forge script script/DeployEnhanced.s.sol \
            --rpc-url ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --via-ir
        fi
      
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts-testnet
        path: broadcast/

  deploy-mainnet:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'mainnet'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: |
        pnpm install
        forge install --no-commit
        
    - name: Build contracts
      run: forge build --via-ir
      
    - name: Run tests
      run: forge test --via-ir
      
    - name: Run security audit
      run: |
        pip install slither-analyzer
        slither . --exclude-dependencies --exclude-informational --exclude-low
        
    - name: Deploy to ${{ github.event.inputs.network }}
      run: |
        if [ "${{ github.event.inputs.network }}" = "ethereum" ]; then
          forge script script/DeployEnhanced.s.sol \
            --rpc-url ${{ secrets.ETHEREUM_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --slow \
            --via-ir
        elif [ "${{ github.event.inputs.network }}" = "arbitrum" ]; then
          forge script script/DeployEnhanced.s.sol \
            --rpc-url ${{ secrets.ARBITRUM_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --slow \
            --via-ir
        elif [ "${{ github.event.inputs.network }}" = "optimism" ]; then
          forge script script/DeployEnhanced.s.sol \
            --rpc-url ${{ secrets.OPTIMISM_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --slow \
            --via-ir
        fi
      
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts-mainnet
        path: broadcast/

  deploy-anvil:
    name: Deploy to Anvil (Local)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: |
        pnpm install
        forge install --no-commit
        
    - name: Build contracts
      run: forge build --via-ir
      
    - name: Start Anvil
      run: |
        anvil --host 0.0.0.0 --port 8545 --chain-id 31337 &
        sleep 5
        
    - name: Deploy to Anvil
      run: |
        forge script script/DeployEnhanced.s.sol \
          --rpc-url http://localhost:8545 \
          --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          --broadcast \
          --via-ir
      
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts-anvil
        path: broadcast/

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-testnet, deploy-mainnet, deploy-anvil]
    if: always()
    
    steps:
    - name: Notify Discord
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          🚀 **EigenLVR v2 Deployment**
          
          **Environment**: ${{ github.event.inputs.environment || 'develop' }}
          **Network**: ${{ github.event.inputs.network || 'anvil' }}
          **Status**: ${{ job.status }}
          **Commit**: ${{ github.sha }}
          **Actor**: ${{ github.actor }}
          
          [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
