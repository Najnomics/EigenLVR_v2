name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        components: [foundry, forge, cast, anvil, chisel]
        
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: |
        pnpm install
        forge install --no-commit
        
    - name: Build contracts
      run: forge build --via-ir
      
    - name: Run tests
      run: forge test --via-ir
      
    - name: Run tests with gas reporting
      run: forge test --via-ir --gas-report
      
    - name: Generate coverage report
      run: forge coverage --via-ir --ir-minimum
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        
    - name: Check formatting
      run: forge fmt --check
      
    - name: Install Slither
      run: |
        pip install slither-analyzer
        
    - name: Run Slither
      run: slither . --exclude-dependencies --exclude-informational --exclude-low

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        
    - name: Build contracts
      run: forge build --via-ir
      
    - name: Install Mythril
      run: |
        pip install mythril
        
    - name: Run Mythril
      run: |
        myth analyze src/EigenLVR_V2.sol --execution-timeout 300
        myth analyze src/privacy/PrivateAuctionManager.sol --execution-timeout 300
        myth analyze src/crosschain/CrossChainPriceMonitor.sol --execution-timeout 300

  gas-optimization:
    name: Gas Optimization
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
        
    - name: Build contracts
      run: forge build --via-ir
      
    - name: Create gas snapshot
      run: forge snapshot --via-ir
      
    - name: Upload gas snapshot
      uses: actions/upload-artifact@v3
      with:
        name: gas-snapshot
        path: .gas-snapshot
